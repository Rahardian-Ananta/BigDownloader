[package]
name = "big-downloader"
version = "0.1.0"
edition = "2021"
authors = ["BIG Downloader Team"]
description = "Aplikasi desktop native Rust untuk mencari, melihat, mengunduh, dan mengonversi data batas wilayah administratif Indonesia dari Badan Informasi Geospasial (BIG)"
readme = "README.md"
license = "MIT OR Apache-2.0"

[dependencies]
# GUI Framework
eframe = { version = "0.29", default-features = false, features = [
    "default_fonts",
    "glow",
    "persistence",
] }
egui = "0.29"

# Async & Networking
tokio = { version = "1.40", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Geospatial & Geometry
geo = "0.28"
geo-types = "0.7"

# Local Database
rusqlite = { version = "0.32", features = ["bundled"] }

# Archive & File Packaging
zip = { version = "2.2", default-features = false, features = ["deflate"] }

# Native File Dialogs
rfd = "0.15"

# Logging & Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"

# File Formats & Utilities
csv = "1.3"
chrono = { version = "0.4", features = ["serde"] }
directories = "5.0"
byteorder = "1.5"
uuid = { version = "1.10", features = ["v4"] }

[dev-dependencies]
tempfile = "3.12"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[package.metadata.deb]
maintainer = "BIG Downloader Team <info@big-downloader.org>"
copyright = "2026, BIG Downloader Team"
license-file = ["LICENSE", "4"]
extended-description = """\
BIG Downloader is a native desktop application for searching, viewing, downloading, \
and converting administrative boundary data for Indonesia using official geospatial \
services from Badan Informasi Geospasial (BIG). Supports 8 GIS export formats: \
GeoJSON, ESRI Shapefile, GeoPackage, KML, CSV, GeoParquet, TopoJSON, and GML."""
section = "science"
priority = "optional"
assets = [
    ["target/release/big-downloader", "usr/bin/", "755"],
    ["assets/icons/icon-256.png", "usr/share/icons/hicolor/256x256/apps/big-downloader.png", "644"],
    ["packaging/debian/big-downloader.desktop", "usr/share/applications/", "644"],
]
depends = "$auto, libgtk-3-0"

